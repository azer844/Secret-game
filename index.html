<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escape The Dark 3D</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050505; font-family: monospace; user-select: none; -webkit-user-select: none; }
        #canvas-container { width: 100%; height: 100%; display: block; }
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0a0000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        #start-btn { padding: 20px 40px; font-size: 1.5rem; background: #ff0000; color: #fff; border: 2px solid #fff; font-family: inherit; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px #ff0000; border-radius: 5px; }
        #ui { position: absolute; top: 20px; left: 20px; color: #ff3333; font-size: 1.2rem; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; display: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(255,255,255,0.6); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; display: none; }
        .joystick-zone { position: absolute; bottom: 30px; width: 90px; height: 90px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; touch-action: none; z-index: 10; display: none; }
        #left-joystick { left: 40px; }
        #action-btn { position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px; background: rgba(150, 0, 0, 0.4); border: 3px solid #ff0000; color: #fff; border-radius: 50%; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; z-index: 10; display: none; text-shadow: 1px 1px 2px #000; }
        #screen-msg { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); color: #ff0000; font-size: 1.4rem; font-weight: bold; text-align: center; background: rgba(0,0,0,0.85); padding: 15px; border: 1px solid #550000; border-radius: 5px; display: none; pointer-events: none; z-index: 10; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="start-screen">
        <h1 style="color: #ff0000; margin-bottom: 30px; letter-spacing: 3px;">ESCAPE THE DARK 3D</h1>
        <button id="start-btn">DÉMARRER LE JEU</button>
    </div>
    <div id="ui">
        <div id="objective">🕹️ OBJECTIF : Allez au fond et trouvez la clé (bloc rouge)</div>
        <div id="inventory" style="margin-top: 5px; color: #aaa;">Inventaire : Aucun</div>
    </div>
    <div id="crosshair"></div>
    <div id="screen-msg"></div>
    <div id="left-joystick" class="joystick-zone"></div>
    <div id="action-btn">INTERAGIR</div>
    <div id="canvas-container"></div>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.15);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        camera.position.set(0, 1.5, 12); 

        const flashlight = new THREE.PointLight(0xffffff, 5, 20);
        scene.add(flashlight);
        scene.add(new THREE.AmbientLight(0x222233));

        // Création visuelle stable (sans ombres lourdes qui font planter Safari)
        const wallMat = new THREE.MeshBasicMaterial({ color: 0x33333a });
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1f });

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 40), floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 40), wallMat);
        leftWall.position.set(-4, 2, 0);
        scene.add(leftWall);

        const rightWall = leftWall.clone();
        rightWall.position.x = 4;
        scene.add(rightWall);

        const backWall = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 0.2), wallMat);
        backWall.position.set(0, 2, -20);
        scene.add(backWall);

        const door = new THREE.Mesh(new THREE.BoxGeometry(2, 2.8, 0.2), new THREE.MeshBasicMaterial({ color: 0x552200 }));
        door.position.set(0, 1.4, -19.8);
        scene.add(door);

        const chest = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
        chest.position.set(-2.5, 0.4, -2);
        scene.add(chest);
        let gameState = { hasKey: false, boxOpened: false, escaped: false, moveForward: 0, touchX: 0, touchY: 0, active: false };

        // Déverrouillage iPad au clic sur DÉMARRER
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('left-joystick').style.display = 'block';
            document.getElementById('action-btn').style.display = 'flex';
            gameState.active = true;
            
            // Forcer le redimensionnement pour éviter l'écran noir de Safari
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        let yaw = 0, pitch = 0;
        window.addEventListener('touchmove', (e) => {
            if(!gameState.active) return;
            for(let i=0; i<e.touches.length; i++) {
                let t = e.touches[i];
                if(t.clientX > window.innerWidth / 2) {
                    if(gameState.touchX !== 0) {
                        yaw -= (t.clientX - gameState.touchX) * 0.007;
                        pitch -= (t.clientY - gameState.touchY) * 0.007;
                        pitch = Math.max(-Math.PI/4, Math.min(Math.PI/4, pitch));
                    }
                    gameState.touchX = t.clientX; gameState.touchY = t.clientY;
                }
            }
        }, { passive: true });

        window.addEventListener('touchend', () => { gameState.touchX = 0; gameState.touchY = 0; });

        const joystick = document.getElementById('left-joystick');
        joystick.addEventListener('touchmove', (e) => {
            if(!gameState.active) return;
            const touch = e.touches[0];
            const rect = joystick.getBoundingClientRect();
            const centerY = rect.top + (rect.height / 2);
            if (touch.clientY < centerY - 10) gameState.moveForward = 1;
            else if (touch.clientY > centerY + 10) gameState.moveForward = -1;
            else gameState.moveForward = 0;
        }, { passive: true });

        joystick.addEventListener('touchend', () => { gameState.moveForward = 0; });

        const actionBtn = document.getElementById('action-btn');
        actionBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(!gameState.active) return;
            let distToChest = camera.position.distanceTo(chest.position);
            let distToDoor = camera.position.distanceTo(door.position);

            if (distToChest < 4 && !gameState.boxOpened) {
                gameState.boxOpened = true;
                gameState.hasKey = true;
                chest.position.y = -5;
                showMsg("🔑 Clé rouge trouvée ! Avancez vers la porte au fond.");
                document.getElementById('inventory').innerText = "Inventaire : Clé rouge";
            } 
            else if (distToDoor < 4) {
                if (gameState.hasKey) {
                    gameState.escaped = true;
                    showMsg("🎉 TU AS REUSSI A T'ÉCHAPPER ! Bravo !");
                    door.position.y = -5;
                } else {
                    showMsg("🔒 La porte est fermée. Trouve le bloc rouge au début du couloir.");
                }
            } else {
                showMsg("Rapproche-toi du bloc rouge ou de la porte pour interagir.");
            }
        });

        function showMsg(text) {
            const msgEl = document.getElementById('screen-msg');
            msgEl.innerText = text; msgEl.style.display = 'block';
            setTimeout(() => { msgEl.style.display = 'none'; }, 3000);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (gameState.active && !gameState.escaped) {
                camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                direction.y = 0; direction.normalize();

                if (gameState.moveForward !== 0) {
                    camera.position.addScaledVector(direction, gameState.moveForward * 0.09);
                }
                camera.position.x = Math.max(-3.5, Math.min(3.5, camera.position.x));
                camera.position.z = Math.max(-19, Math.min(13, camera.position.z));
            }
            flashlight.position.copy(camera.position);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
