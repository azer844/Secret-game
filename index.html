<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape The Dark - 3D Horror</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #000; font-family: 'Courier New', Courier, monospace; user-select: none;
        }
        #canvas-container { width: 100%; height: 100%; display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #ff3333; font-size: 1.2rem;
            text-shadow: 0 0 5px #000; pointer-events: none; z-index: 10;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
            background: rgba(255, 255, 255, 0.4); border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }
        .joystick-zone {
            position: absolute; bottom: 30px; width: 100px; height: 100px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; touch-action: none; z-index: 10;
        }
        #left-joystick { left: 40px; }
        #action-btn {
            position: absolute; bottom: 45px; right: 40px; width: 70px; height: 70px;
            background: rgba(255, 0, 0, 0.2); border: 2px solid #ff0000; color: #ff3333;
            border-radius: 50%; font-weight: bold; display: flex; align-items: center;
            justify-content: center; font-size: 0.9rem; z-index: 10;
        }
        #screen-msg {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 1.5rem; text-align: center; background: rgba(0,0,0,0.7);
            padding: 15px; border-radius: 5px; display: none; pointer-events: none; z-index: 10;
        }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="ui">
        <div id="objective">Objectif : Trouver la clé dans le couloir sombre</div>
        <div id="inventory" style="margin-top: 5px; color: #aaa;">Inventaire : Aucun objet</div>
    </div>
    <div id="crosshair"></div>
    <div id="screen-msg"></div>
    <div id="left-joystick" class="joystick-zone"></div>
    <div id="action-btn">INTERAGIR</div>
    <div id="canvas-container"></div>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.15);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
        camera.position.set(0, 1.6, 12); 
        const flashlight = new THREE.SpotLight(0xffffff, 3, 15, Math.PI / 5, 0.5, 1);
        flashlight.castShadow = true;
        scene.add(flashlight);
        scene.add(flashlight.target);
        const ambientLight = new THREE.AmbientLight(0x0a0a14);
        scene.add(ambientLight);
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9 });
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x1f1f1f, roughness: 0.5 });
        const floorGeo = new THREE.PlaneGeometry(6, 30);
        const floor = new THREE.Mesh(floorGeo, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        const wallGeo = new THREE.BoxGeometry(0.2, 4, 30);
        const leftWall = new THREE.Mesh(wallGeo, wallMaterial);
        leftWall.position.set(-3, 2, 0);
        leftWall.castShadow = true; leftWall.receiveShadow = true;
        scene.add(leftWall);
        const rightWall = leftWall.clone();
        rightWall.position.x = 3;
        scene.add(rightWall);
        const backWallGeo = new THREE.BoxGeometry(6, 4, 0.2);
        const backWall = new THREE.Mesh(backWallGeo, wallMaterial);
        backWall.position.set(0, 2, -15);
        scene.add(backWall);
        const doorGeo = new THREE.BoxGeometry(1.5, 2.5, 0.1);
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x501010, roughness: 0.6 });
        const door = new THREE.Mesh(doorGeo, doorMat);
        door.position.set(0, 1.25, -14.8);
        scene.add(door);
        const boxGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x443322 });
        const chest = new THREE.Mesh(boxGeo, boxMat);
        chest.position.set(-2.2, 0.3, 2);
        scene.add(chest);
        let gameState = {
            hasKey: false, boxOpened: false, escaped: false, moveForward: 0, touchX: 0, touchY: 0
        };
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playScream() {
            try {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 1.5);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 1.5);
            } catch(e){}
        }
        let yaw = 0, pitch = 0;
        window.addEventListener('touchmove', (e) => {
            for(let i=0; i<e.touches.length; i++) {
                let t = e.touches[i];
                if(t.clientX > window.innerWidth / 2) {
                    if(gameState.touchX !== 0) {
                        yaw -= (t.clientX - gameState.touchX) * 0.005;
                        pitch -= (t.clientY - gameState.touchY) * 0.005;
                        pitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, pitch));
                    }
                    gameState.touchX = t.clientX; gameState.touchY = t.clientY;
                }
            }
        });
        window.addEventListener('touchend', () => { gameState.touchX = 0; gameState.touchY = 0; });
        const joystick = document.getElementById('left-joystick');
        joystick.addEventListener('touchmove', (e) => {
            const touch = e.touches; const rect = joystick.getBoundingClientRect();
            const center = { x: rect.left + 50, y: rect.top + 50 }; const dy = touch.clientY - center.y;
            if(dy < -15) gameState.moveForward = 1;
            else if(dy > 15) gameState.moveForward = -1;
            else gameState.moveForward = 0;
        });
        joystick.addEventListener('touchend', () => { gameState.moveForward = 0; });
        const actionBtn = document.getElementById('action-btn');
        actionBtn.addEventListener('touchstart', () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            let distToChest = camera.position.distanceTo(chest.position);
            let distToDoor = camera.position.distanceTo(door.position);
            if (distToChest < 3.5 && !gameState.boxOpened) {
                gameState.boxOpened = true; gameState.hasKey = true; chest.position.y = -2;
                showMsg("Vous avez trouvé une clé rouillée !");
                document.getElementById('inventory').innerText = "Inventaire : Clé de la porte";
                playScream();
            } 
            else if (distToDoor < 3.5) {
                if (gameState.hasKey) {
                    gameState.escaped = true; showMsg("VOUS AVEZ SURVÉCU ! ✨"); door.position.x = 2;
                } else { showMsg("La porte est fermée à clé..."); }
            } else { showMsg("Rien ici. Fouillez le couloir."); }
        });
        function showMsg(text) {
            const msgEl = document.getElementById('screen-msg'); msgEl.innerText = text;
            msgEl.style.display = 'block'; setTimeout(() => { msgEl.style.display = 'none'; }, 3000);
        }
        function animate() {
            requestAnimationFrame(animate);
            if (!gameState.escaped) {
                camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                direction.y = 0; direction.normalize();
                if (gameState.moveForward !== 0) { camera.position.addScaledVector(direction, gameState.moveForward * 0.08); }
                camera.position.x = Math.max(-2.5, Math.min(2.5, camera.position.x));
                camera.position.z = Math.max(-14, Math.min(14, camera.position.z));
            }
            flashlight.position.copy(camera.position);
            const targetPosition = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).add(camera.position);
            flashlight.target.position.copy(targetPosition);
            if(Math.random() > 0.98) { flashlight.intensity = Math.random() * 3; } else { flashlight.intensity = 3; }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
